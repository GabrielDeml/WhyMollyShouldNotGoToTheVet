<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- FASHION ICON - Molly on the runway, serving LOOKS -->

  <!-- Runway background -->
  <rect width="400" height="300" fill="#1a1a1a"/>

  <!-- Spotlights -->
  <ellipse cx="100" cy="0" rx="80" ry="150" fill="#FF69B4" opacity="0.15"/>
  <ellipse cx="300" cy="0" rx="80" ry="150" fill="#00CED1" opacity="0.15"/>
  <ellipse cx="200" cy="0" rx="100" ry="200" fill="#FFD700" opacity="0.1"/>

  <!-- Runway/catwalk -->
  <polygon points="150,300 250,300 280,180 120,180" fill="#333"/>
  <polygon points="160,300 240,300 265,190 135,190" fill="#444"/>

  <!-- Camera flashes -->
  <circle cx="50" cy="250" r="15" fill="#fff" opacity="0.3"/>
  <circle cx="350" cy="240" r="12" fill="#fff" opacity="0.25"/>
  <circle cx="80" cy="200" r="10" fill="#fff" opacity="0.2"/>
  <circle cx="320" cy="220" r="8" fill="#fff" opacity="0.2"/>

  <!-- MOLLY THE SUPERMODEL -->
  <!-- Body - sassy pose -->
  <ellipse cx="200" cy="200" rx="55" ry="30" fill="#2C2C2C" transform="rotate(-5 200 200)"/>

  <!-- THE ICONIC RAINBOW SWEATER - exaggerated fashion version -->
  <ellipse cx="200" cy="195" rx="52" ry="27" fill="#00CED1" transform="rotate(-5 200 195)"/>

  <!-- Bold rainbow stripes -->
  <g transform="rotate(-5 200 195)">
    <rect x="150" y="172" width="100" height="7" fill="#FF1493" rx="2"/>
    <rect x="148" y="179" width="104" height="6" fill="#FF4500" rx="2"/>
    <rect x="147" y="185" width="106" height="6" fill="#FFD700" rx="2"/>
    <rect x="148" y="191" width="104" height="6" fill="#32CD32" rx="2"/>
    <rect x="150" y="197" width="100" height="6" fill="#4169E1" rx="2"/>
    <rect x="152" y="203" width="96" height="6" fill="#8A2BE2" rx="2"/>
  </g>

  <!-- Legs - one popped forward (model pose) -->
  <ellipse cx="165" cy="235" rx="10" ry="25" fill="#2C2C2C"/>
  <ellipse cx="185" cy="240" rx="10" ry="28" fill="#2C2C2C"/>
  <ellipse cx="215" cy="240" rx="10" ry="28" fill="#2C2C2C"/>
  <ellipse cx="235" cy="235" rx="10" ry="25" fill="#2C2C2C"/>

  <!-- Fancy paws -->
  <ellipse cx="165" cy="262" rx="12" ry="7" fill="#2C2C2C"/>
  <ellipse cx="185" cy="270" rx="12" ry="7" fill="#2C2C2C"/>
  <ellipse cx="215" cy="270" rx="12" ry="7" fill="#2C2C2C"/>
  <ellipse cx="235" cy="262" rx="12" ry="7" fill="#2C2C2C"/>

  <!-- Head - held HIGH with attitude -->
  <ellipse cx="200" cy="145" rx="45" ry="40" fill="#2C2C2C"/>

  <!-- Ears - perked up confidently -->
  <ellipse cx="155" cy="115" rx="18" ry="35" fill="#1a1a1a" transform="rotate(-15 155 115)"/>
  <ellipse cx="245" cy="115" rx="18" ry="35" fill="#1a1a1a" transform="rotate(15 245 115)"/>

  <!-- Snout - slightly upturned (snooty) -->
  <ellipse cx="200" cy="165" rx="25" ry="18" fill="#3d3d3d"/>

  <!-- Gray dignified muzzle -->
  <ellipse cx="200" cy="162" rx="15" ry="10" fill="#5a5a5a"/>

  <!-- Nose -->
  <ellipse cx="200" cy="175" rx="12" ry="8" fill="#1a1a1a"/>
  <ellipse cx="197" cy="173" rx="3" ry="2" fill="#3d3d3d"/>

  <!-- Confident smirk -->
  <path d="M188 182 Q200 188 212 182" stroke="#1a1a1a" stroke-width="2" fill="none"/>
  <path d="M212 182 L218 179" stroke="#1a1a1a" stroke-width="2" fill="none"/>

  <!-- Eyes - giving ATTITUDE -->
  <ellipse cx="180" cy="140" rx="14" ry="11" fill="#fff"/>
  <ellipse cx="220" cy="140" rx="14" ry="11" fill="#fff"/>
  <ellipse cx="182" cy="142" rx="7" ry="7" fill="#4a3728"/>
  <ellipse cx="222" cy="142" rx="7" ry="7" fill="#4a3728"/>
  <!-- Side-eye sparkle -->
  <ellipse cx="185" cy="139" rx="3" ry="3" fill="#fff"/>
  <ellipse cx="225" cy="139" rx="3" ry="3" fill="#fff"/>

  <!-- Sassy raised eyebrow -->
  <path d="M165 130 Q180 125 193 133" stroke="#1a1a1a" stroke-width="3" fill="none"/>
  <path d="M207 133 Q225 123 240 132" stroke="#1a1a1a" stroke-width="3" fill="none"/>

  <!-- Fabulous collar/accessory -->
  <ellipse cx="200" cy="175" rx="35" ry="12" fill="#FF69B4" opacity="0.8"/>
  <circle cx="200" cy="180" r="8" fill="#FFD700"/>
  <circle cx="200" cy="180" r="4" fill="#FFF"/>

  <!-- Sparkles and stars -->
  <text x="100" y="100" font-size="24">✨</text>
  <text x="280" y="80" font-size="28">⭐</text>
  <text x="320" y="150" font-size="20">✨</text>
  <text x="60" y="160" font-size="22">💫</text>
  <text x="250" y="120" font-size="16">✨</text>

  <!-- Fashion text -->
  <text x="200" y="30" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#FFD700" font-style="italic">
    SERVING LOOKS
  </text>

  <!-- Vogue-style label -->
  <text x="200" y="295" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#888" letter-spacing="8">
    VOGUE DACHSHUND
  </text>
</svg>
