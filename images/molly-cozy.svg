<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- A dachshund burrito - Molly wrapped up like a cozy sausage in blankets -->

  <!-- Warm cozy background -->
  <rect width="400" height="300" fill="#FFF8E7"/>

  <!-- Cozy rays emanating from the burrito -->
  <g opacity="0.3">
    <polygon points="200,150 150,20 250,20" fill="#FFB347"/>
    <polygon points="200,150 350,50 380,130" fill="#FFB347"/>
    <polygon points="200,150 380,200 350,280" fill="#FFB347"/>
    <polygon points="200,150 250,290 150,290" fill="#FFB347"/>
    <polygon points="200,150 20,280 50,200" fill="#FFB347"/>
    <polygon points="200,150 20,130 50,50" fill="#FFB347"/>
  </g>

  <!-- THE MIGHTY BLANKET BURRITO -->
  <!-- Outer tortilla/blanket wrap -->
  <ellipse cx="200" cy="165" rx="140" ry="80" fill="#E8B87D"/>
  <ellipse cx="200" cy="165" rx="130" ry="70" fill="#D4A574"/>

  <!-- Inner cozy layer - fuzzy blanket -->
  <ellipse cx="200" cy="165" rx="115" ry="58" fill="#B8D4E8"/>

  <!-- Molly's adorable face poking out -->
  <!-- Head -->
  <ellipse cx="200" cy="140" rx="55" ry="50" fill="#2C2C2C"/>

  <!-- Ears poking up through blanket -->
  <ellipse cx="145" cy="115" rx="20" ry="40" fill="#1a1a1a" transform="rotate(-20 145 115)"/>
  <ellipse cx="255" cy="115" rx="20" ry="40" fill="#1a1a1a" transform="rotate(20 255 115)"/>

  <!-- Snout -->
  <ellipse cx="200" cy="165" rx="30" ry="22" fill="#3d3d3d"/>

  <!-- Silver muzzle - senior pup! -->
  <ellipse cx="200" cy="160" rx="20" ry="12" fill="#6a6a6a"/>

  <!-- Nose - shiny black -->
  <ellipse cx="200" cy="175" rx="14" ry="10" fill="#1a1a1a"/>
  <ellipse cx="196" cy="172" rx="4" ry="3" fill="#4a4a4a"/>

  <!-- Happy squinty eyes - maximum cozy -->
  <path d="M165 130 Q180 120 195 130" stroke="#1a1a1a" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M205 130 Q220 120 235 130" stroke="#1a1a1a" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- Rosy cheeks -->
  <ellipse cx="160" cy="145" rx="12" ry="8" fill="#FFB6C1" opacity="0.6"/>
  <ellipse cx="240" cy="145" rx="12" ry="8" fill="#FFB6C1" opacity="0.6"/>

  <!-- Content smile -->
  <path d="M185 185 Q200 195 215 185" stroke="#1a1a1a" stroke-width="3" fill="none"/>

  <!-- Little paws sticking out bottom of burrito -->
  <ellipse cx="150" cy="230" rx="18" ry="12" fill="#2C2C2C"/>
  <ellipse cx="250" cy="230" rx="18" ry="12" fill="#2C2C2C"/>

  <!-- Toe beans! -->
  <circle cx="143" cy="235" r="4" fill="#3d3d3d"/>
  <circle cx="150" cy="238" r="4" fill="#3d3d3d"/>
  <circle cx="157" cy="235" r="4" fill="#3d3d3d"/>
  <circle cx="243" cy="235" r="4" fill="#3d3d3d"/>
  <circle cx="250" cy="238" r="4" fill="#3d3d3d"/>
  <circle cx="257" cy="235" r="4" fill="#3d3d3d"/>

  <!-- Steam/warmth lines -->
  <path d="M120 90 Q115 70 125 55" stroke="#FFB347" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M200 70 Q195 50 205 35" stroke="#FFB347" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M280 90 Q285 70 275 55" stroke="#FFB347" stroke-width="3" fill="none" opacity="0.6"/>

  <!-- Text label -->
  <text x="200" y="280" text-anchor="middle" font-family="Comic Sans MS, cursive" font-size="18" fill="#8B4513">~ The Perfect Burrito ~</text>

  <!-- Little Z's -->
  <text x="290" y="100" font-family="Comic Sans MS" font-size="16" fill="#667eea" opacity="0.7">z</text>
  <text x="310" y="80" font-family="Comic Sans MS" font-size="22" fill="#667eea" opacity="0.8">z</text>
  <text x="335" y="55" font-family="Comic Sans MS" font-size="28" fill="#667eea">Z</text>
</svg>
